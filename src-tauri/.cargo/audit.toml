# cargo-audit configuration.
#
# The `Audit` workflow runs `cargo audit` against this lockfile every Monday and
# opens an issue per finding. By 2026-09-17 that had produced 19 open issues and
# none of them was actionable, which is the state in which a security check stops
# being read — so the known findings are accepted here, each with the reason and
# the condition that reopens it, and anything *new* still breaks through.
#
# Two things this file is not. It is not a way to make the job quiet: the nine
# ids below are the complete set of what was analysed on 2026-09-17, and a tenth
# finding fails the job as it should. And it is not a substitute for a fix:
# everything with a fix available got one in the same commit — `rustls` from
# 0.23.42 to 0.23.45 for RUSTSEC-2026-0285, a real TLS 1.3 handshake flaw in the
# transport the updater and every metadata lookup use, and `chacha20` off a
# yanked 0.10.1.
#
# Why not `--target-os macos --target-arch aarch64`, which would be the obvious
# answer to "half of these are Linux-only": measured, it changes nothing. Those
# flags filter on a platform declared *in the advisory*, and none of these
# declare one. `cargo audit` reads `Cargo.lock`, which holds every platform's
# crates, and it has no way to resolve a dependency tree per target. `cargo tree
# --target aarch64-apple-darwin -i <crate>` is what answers that question, and
# the answers are recorded below.
#
# Ten further advisories (RUSTSEC-2024-0411 … 0420, the GTK3 bindings) are
# deliberately absent: RustSec withdrew them on 2026-08-14, so they are no
# longer reported and there is nothing to accept.

[advisories]
ignore = [
  # --- Not in the macOS dependency tree at all -------------------------------
  # rekord-lib ships for aarch64-apple-darwin only. These reach `Cargo.lock`
  # through Tauri's Linux backend and are never compiled, let alone linked.
  # Verified with `cargo tree --target aarch64-apple-darwin -i <crate>`, which
  # answers "nothing to print" for each.
  #
  # Reopen if: a second platform is ever a target (see G2 in
  # docs/FUTURE_CONSIDERATIONS.md). Then these stop being irrelevant and the
  # unsound ones need reading properly.
  "RUSTSEC-2024-0429",  # glib 0.18.5 — unsound VariantStrIter iterators
  "RUSTSEC-2026-0221",  # event-listener 5.4.1 — !Send tags cross threads
  "RUSTSEC-2024-0370",  # proc-macro-error 1.0.4 — unmaintained

  # --- In the tree, unmaintained only, and no version fixes it ---------------
  # "Unmaintained" is not a vulnerability: it says the crate has no maintainer,
  # not that it has a flaw. None of these has a patched release to move to, and
  # none is a direct dependency — they arrive through crates we do depend on.
  #
  # Reopen if: any of them turns into a real advisory (a vulnerability or an
  # unsoundness), or the parent drops it.

  # paste is a proc-macro, so it runs at build time and is not in the binary.
  # It arrives through lofty, the tag reader — and checked against crates.io,
  # lofty 0.25.2 still depends on it, so the pending 0.22 -> 0.25 upgrade does
  # not resolve this one either.
  "RUSTSEC-2024-0436",  # paste 1.0.15

  # The unic-* family arrives through urlpattern -> tauri-utils, i.e. with
  # Tauri itself. Nothing to do here but wait for Tauri to move off it.
  "RUSTSEC-2025-0081",  # unic-char-property 0.9.0
  "RUSTSEC-2025-0075",  # unic-char-range 0.9.0
  "RUSTSEC-2025-0080",  # unic-common 0.9.0
  "RUSTSEC-2025-0100",  # unic-ucd-ident 0.9.0
  "RUSTSEC-2025-0098",  # unic-ucd-version 0.9.0
]
