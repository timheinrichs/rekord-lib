[package]
name = "rekord-lib"
version = "0.6.0"
description = "Prepare audio files for CDJ/XDJ and Rekordbox (conversion, metadata, duplicate detection, Bandcamp)."
authors = ["Tim Heinrichs"]
edition = "2021"
license = "MIT"
repository = "https://github.com/timheinrichs/rekord-lib"
homepage = "https://github.com/timheinrichs/rekord-lib"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rekord_lib_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# "time" is what lets a paused scan wait between checks instead of spinning.
tokio = { version = "1", features = ["fs", "io-util", "process", "time"] }
thiserror = "2"
base64 = "0.22"
zip = "2"
rusty-chromaprint = "0.3"
rustfft = "6"
trash = "5.2.6"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-window-state = "2.4.1"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Only for the free-memory half of the worker budget (audio::workers). Pure Rust
# plus libc, so it links against system libraries only — a native dependency
# would break the self-contained-binaries rule.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"
# Only for the DSP benchmark (tests/dsp_bench.rs). stratum-dsp is deliberately a
# dev-dependency until B7 has decided whether it beats our own detector — a
# normal dependency would ship it in the bundle before that question is settled.
# `ml` stays off: it pulls ONNX Runtime, a native library, which would break the
# self-contained-binaries rule.
stratum-dsp = { version = "1", default-features = false }
sha2 = "0.10"
unicode-normalization = "0.1"

# Abhängigkeiten auch im Dev-Build optimieren – macht die Chromaprint-/FFT-
# Berechnung der Duplikatsuche im Dev-Modus um ein Vielfaches schneller,
# ohne die Kompilierzeit des eigenen Codes zu erhöhen.
[profile.dev.package."*"]
opt-level = 3

